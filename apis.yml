aid: cambridge-mobile-telematics
name: Cambridge Mobile Telematics
description: 'Cambridge Mobile Telematics (CMT) is the world''s largest telematics
  service provider, on a mission to make roads and drivers safer. Its AI-driven DriveWell
  Fusion platform gathers sensor data from millions of IoT devices — smartphones,
  proprietary Tags, connected vehicles, dashcams, and third-party devices — and fuses
  it with contextual data to build a unified view of vehicle and driver behavior. CMT
  powers usage-based insurance (UBI), crash detection and assistance, distracted-driving
  programs, fleet safety, and public-sector road-safety initiatives for insurers,
  automakers, rideshare, and government customers worldwide. Developers integrate via
  the gated DriveWell Mobile SDK (iOS/Android) and the DriveWell Portal; the platform
  is ISO 27001, ISO 27701, and SOC 2 Type II aligned. Backed by SoftBank Vision Fund
  and General Catalyst.'
